{% extends "template.html" %}
{% block content %}
    <h3> Add a New Recipe </h3>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form }}
        <input type="submit" value="Save New Image" class="form-button">
    </form>

    <br>
    
    <p><a href="% url 'recipe_details.html' pk=view.kwargs.pk %"></a> Cancel and Go Back</p>
{% endblock %}
