{% extends "template.html" %}
    
   {% block content %}
   <h1> Recipes </h1>
        <ul>
            {% for recipe in recipes %}
                <li>
                    <a href="{% url 'recipe_detail' recipe.pk %}">{{ recipe.name }}</a>
                    by {{ recipe.author.user.username}}
                </li>
            {% empty %}
                <li> No recipes in the database. </li>
        {% endfor %}
    </ul>

    <br>

    {% if user.is_authenticated %}
    <p>
        <a href="{% url 'recipe_add' %}"> => Add New Recipe </a>
    </p>
    {% endif %}

{% endblock %}
